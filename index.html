<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPROJECT</title>
    <link rel="icon" type="image/png" href="calculator.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div>
        <h1>TOGGLE</h1>
        <h1>⬇️--------⬇️</h1>
        <div class="contain">
            <div class="btn" onclick="darkLight()"></div>
        </div>
    </div>
    <!-- BUTTON -->
    <div>
        <h1>BUTTON</h1>
        <h1>⬇️--------⬇️</h1>
        <div class="pm">
            <button id="minus"> - </button>
            <input class="numb" type="number" id="num" value="0" readonly>
            <button id="plus"> + </button>
            </div>
    </div>
    <!-- CALCULATOR -->
    <h1>CALC</h1>
    <h1>⬇️--------⬇️</h1>
    <div class="container">
        <input type="text" class="inputBox" placeholder="0" disabled>
        <div class="btn-container" onclick="">
        <div class="btn-1" onclick="clearData()">AC</div>
        <div class="btn-1" onclick="deleteDigit()">DEL</div>
        <div class="btn-1" onclick="value('%')">%</div>
        <div class="btn-1" onclick="value('/')">/</div>
        <div class="btn-2" onclick="value(7)">7</div>
        <div class="btn-2" onclick="value(8)">8</div>
        <div class="btn-2" onclick="value(9)">9</div>
        <div class="btn-1" onclick="value('*')">*</div>
        <div class="btn-2" onclick="value(4)">4</div>
        <div class="btn-2" onclick="value(5)">5</div>
        <div class="btn-2" onclick="value(6)">6</div>
        <div class="btn-1" onclick="value('-')">-</div> 
        <div class="btn-2" onclick="value(1)">1</div>
        <div class="btn-2" onclick="value(2)">2</div> 
        <div class="btn-2" onclick="value(3)">3</div>  
        <div class="btn-1" onclick="value('+')">+</div>
        <div class="btn-2" onclick="value(0)">0</div>
        <div class="btn-2" onclick="value('.')">.</div>
        <div class="btn-1" onclick="calculate()" id="equal">=</div>
        </div>
    </div>
    <footer>MADE By PARTH CHAURASiA</footer>
    <script src="script.js"></script>
</body>
</html>
